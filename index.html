<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soft Step Workshop — Thank You</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #2c2a29;
      --muted: #66615e;
      --accent: #3d5a45;
      --accent-hover: #2e4534;
      --border: #e6e1da;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    main {
      background: var(--card);
      max-width: 600px;
      width: 100%;
      padding: 3rem 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    .brand {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 1rem;
      display: block;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: normal;
      line-height: 1.3;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .lead {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .story {
      text-align: left;
      background: var(--bg);
      padding: 1.75rem;
      border-radius: 8px;
      margin-bottom: 2.25rem;
      font-size: 1rem;
    }

    .story p + p {
      margin-top: 1rem;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.9rem 2rem;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
      color: var(--muted);
    }

    footer a {
      color: var(--text);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      main {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="brand">Soft Step Workshop</span>
    <h1>Thank you for your order.</h1>
    <p class="lead">If you found this page from the flyer inside your parcel—thank you for supporting my shop.</p>

    

    <a href="https://www.ebay.co.uk/usr/gmfb45" class="btn" target="_blank" rel="noopener">Browse My eBay Store</a>

    <footer>
      <p>Questions about an order? <a href="https://www.ebay.co.uk/usr/gmfb45" target="_blank" rel="noopener">Message me on eBay</a> or email <a href="mailto:softstepworkshop@gmail.co.uk">softstepworkshop@gmail.co.uk</a>.</p>
      <p style="margin-top: 0.5rem;">&copy; 2026 Soft Step Workshop</p>
    </footer>
  </main>
</body>
</html>
